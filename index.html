<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>イベント受付入力（タップ確定版）</title>
  <style>
    /* 基本スタイル */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #f5f5f7;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      height: 100vh;
    }

    /* 入力フォーム風のボタン */
    .form-group {
      width: 85%;
      max-width: 340px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .form-label {
      font-size: 13px;
      color: #8e8e93;
      font-weight: 600;
      padding-left: 4px;
    }
    .open-btn {
      width: 100%;
      padding: 16px;
      font-size: 16px;
      text-align: left;
      background-color: white;
      color: #000;
      border: 1px solid #d1d1d6;
      border-radius: 12px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .open-btn.placeholder {
      color: #c7c7cc;
    }
    .open-btn::after {
      content: "▼";
      font-size: 10px;
      color: #c7c7cc;
    }

    /* 背景のオーバーレイ */
    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.4);
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.3s ease, visibility 0.3s ease;
      z-index: 999;
    }
    .overlay.active {
      opacity: 1;
      visibility: visible;
    }

    /* ボトムシート */
    .bottom-sheet {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      background-color: white;
      border-top-left-radius: 20px;
      border-top-right-radius: 20px;
      transform: translateY(100%);
      transition: transform 0.3s cubic-bezier(0.25, 1, 0.5, 1);
      z-index: 1000;
      padding-bottom: env(safe-area-inset-bottom);
    }
    .bottom-sheet.active {
      transform: translateY(0);
    }

    /* ヘッダー（決定を無くし、キャンセルと案内のみに） */
    .sheet-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px;
      border-bottom: 1px solid #e5e5ea;
    }
    .sheet-btn {
      background: none;
      border: none;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }
    .cancel-btn { color: #8e8e93; }
    /* ダミーの空白（タイトルを中央寄せにするため） */
    .sheet-spacer { width: 80px; } 
    .sheet-title { font-size: 16px; font-weight: bold; text-align: center; }

    /* ドラムロール部分 */
    .picker-container {
      position: relative;
      height: 240px; /* タップ領域を少し広げるため5行→6行分に見えるよう微調整 */
      overflow: hidden;
      background: #fafafa;
    }
    .picker-roll {
      height: 100%;
      overflow-y: scroll;
      scroll-snap-type: y mandatory;
      scrollbar-width: none;
      padding: 100px 0; /* 中央位置の計算調整 */
    }
    .picker-roll::-webkit-scrollbar {
      display: none;
    }
    .picker-item {
      height: 40px;
      line-height: 40px;
      text-align: center;
      font-size: 20px;
      color: #8e8e93;
      scroll-snap-align: center;
      transition: color 0.15s, transform 0.15s;
      transform: scale(0.9);
      cursor: pointer;
    }
    .picker-item.selected {
      color: #0071e3; /* 選択中であることがわかりやすいように青色に変更 */
      font-weight: bold;
      transform: scale(1.1);
    }
    .picker-mask {
      position: absolute;
      top: 100px;
      left: 0;
      width: 100%;
      height: 40px;
      border-top: 1px solid #e5e5ea;
      border-bottom: 1px solid #e5e5ea;
      pointer-events: none;
      background: linear-gradient(to bottom, rgba(255,255,255,0.1), rgba(255,255,255,0));
    }
  </style>
</head>
<body>

  <!-- 1. 年齢の入力ボタン -->
  <div class="form-group">
    <div class="form-label">年齢</div>
    <button class="open-btn placeholder" id="btn-age" data-type="age">選択してください</button>
  </div>

  <!-- 2. 出身都道府県の入力ボタン -->
  <div class="form-group">
    <div class="form-label">出身都道府県</div>
    <button class="open-btn placeholder" id="btn-prefecture" data-type="prefecture">選択してください</button>
  </div>

  <!-- 3. 来場回数の入力ボタン -->
  <div class="form-group">
    <div class="form-label">来場回数</div>
    <button class="open-btn placeholder" id="btn-visits" data-type="visits">選択してください</button>
  </div>


  <!-- ボトムシートUI -->
  <div class="overlay" id="overlay"></div>
  <div class="bottom-sheet" id="bottomSheet">
    <div class="sheet-header">
      <button class="sheet-btn cancel-btn" id="cancelBtn">閉じる</button>
      <div class="sheet-title" id="sheetTitle">選択</div>
      <div class="sheet-spacer"></div> <!-- 左右バランス用 -->
    </div>
    <div class="picker-container">
      <div class="picker-mask"></div>
      <div class="picker-roll" id="pickerRoll">
        <!-- JSで動的に項目が挿入されます -->
      </div>
    </div>
  </div>

  <script>
    const dataSource = {
      age: {
        title: "タップして年齢を確定",
        items: Array.from({ length: 50 }, (_, i) => `${i + 18} 歳`)
      },
      prefecture: {
        title: "タップして都道府県を確定",
        items: [
          "北海道", "青森県", "岩手県", "宮城県", "秋田県", "山形県", "福島県",
          "茨城県", "栃木県", "群馬県", "埼玉県", "千葉県", "東京都", "神奈川県",
          "新潟県", "富山県", "石川県", "福井県", "山梨県", "長野県", "岐阜県",
          "静岡県", "愛知県", "三重県", "滋賀県", "京都府", "大阪府", "兵庫県",
          "奈良県", "和歌山県", "鳥取県", "島根県", "岡山県", "広島県", "山口県",
          "徳島県", "香川県", "愛媛県", "高知県", "福岡県", "佐賀県", "長崎県",
          "熊本県", "大分県", "宮崎県", "鹿児島県", "沖縄県"
        ]
      },
      visits: {
        title: "タップして来場回数を確定",
        items: Array.from({ length: 100 }, (_, i) => `${i + 1} 回`)
      }
    };

    const userSelection = {
      age: { index: 0, hasSelected: false },
      prefecture: { index: 0, hasSelected: false },
      visits: { index: 0, hasSelected: false }
    };

    let currentActiveType = null; 
    let tempSelectedIndex = 0;
    const itemHeight = 40;

    const overlay = document.getElementById('overlay');
    const bottomSheet = document.getElementById('bottomSheet');
    const pickerRoll = document.getElementById('pickerRoll');
    const sheetTitle = document.getElementById('sheetTitle');
    const cancelBtn = document.getElementById('cancelBtn');

    // ピッカーを開く
    function openPicker(type) {
      currentActiveType = type;
      const data = dataSource[type];
      
      sheetTitle.textContent = data.title;
      pickerRoll.innerHTML = '';
      
      tempSelectedIndex = userSelection[type].index;

      data.items.forEach((item, index) => {
        const div = document.createElement('div');
        div.className = 'picker-item';
        if (index === tempSelectedIndex) div.classList.add('selected');
        div.textContent = item;
        
        // 【重要】各アイテムにクリック（タップ）イベントを付与
        div.addEventListener('click', () => {
          // タップされたのが「現在中央にある（選択中）」のアイテムだったら確定する
          if (index === tempSelectedIndex) {
            confirmSelection();
          } else {
            // 中央以外のアイテムがタップされた場合は、そこまでスムーズスクロールさせる（親切設計）
            scrollToIndex(index);
          }
        });

        pickerRoll.appendChild(div);
      });

      overlay.classList.add('active');
      bottomSheet.classList.add('active');

      setTimeout(() => {
        pickerRoll.scrollTo({ top: tempSelectedIndex * itemHeight });
      }, 10);
    }

    function closePicker() {
      overlay.classList.remove('active');
      bottomSheet.classList.remove('active');
    }

    // 指定位置へのスクロール用
    function scrollToIndex(index) {
      pickerRoll.scrollTo({
        top: index * itemHeight,
        behavior: 'smooth'
      });
    }

    // 確定処理
    function confirmSelection() {
      if (!currentActiveType) return;

      userSelection[currentActiveType].index = tempSelectedIndex;
      userSelection[currentActiveType].hasSelected = true;

      const activeBtn = document.querySelector(`.open-btn[data-type="${currentActiveType}"]`);
      const selectedValue = dataSource[currentActiveType].items[tempSelectedIndex];
      
      activeBtn.textContent = selectedValue;
      activeBtn.classList.remove('placeholder');

      closePicker();
    }

    // スクロール時の選択変更
    pickerRoll.addEventListener('scroll', () => {
      if (!currentActiveType) return;
      
      const maxIndex = dataSource[currentActiveType].items.length - 1;
      let index = Math.round(pickerRoll.scrollTop / itemHeight);
      
      if (index < 0) index = 0;
      if (index > maxIndex) index = maxIndex;

      if (index !== tempSelectedIndex) {
        const items = pickerRoll.querySelectorAll('.picker-item');
        if(items[tempSelectedIndex]) items[tempSelectedIndex].classList.remove('selected');
        if(items[index]) items[index].classList.add('selected');
        tempSelectedIndex = index;
      }
    });

    // 初期設定
    document.querySelectorAll('.open-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const type = btn.getAttribute('data-type');
        openPicker(type);
      });
    });

    cancelBtn.addEventListener('click', closePicker);
    overlay.addEventListener('click', closePicker);
  </script>
</body>
</html>
